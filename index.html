<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 המשחקים האחרונים</title>
    <style>

        .floating-paddle {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.1;
            animation: floatPaddle 15s linear infinite;
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .animated-player {
            animation: playerSwing 2s ease-in-out infinite;
        }
        
        .animated-player-right {
            animation: playerSwingRight 2.5s ease-in-out infinite;
        }

        @keyframes playerSwing {
            0% { transform: rotate(-10deg) translateY(0); }
            25% { transform: rotate(5deg) translateY(-5px); }
            50% { transform: rotate(15deg) translateY(-8px); }
            75% { transform: rotate(-5deg) translateY(-3px); }
            100% { transform: rotate(-10deg) translateY(0); }
        }
        
        @keyframes playerSwingRight {
            0% { transform: rotate(10deg) translateY(0); }
            25% { transform: rotate(-5deg) translateY(-3px); }
            50% { transform: rotate(-15deg) translateY(-6px); }
            75% { transform: rotate(5deg) translateY(-4px); }
            100% { transform: rotate(10deg) translateY(0); }
        }

        .mobile-menu-label {
          font-size: 16px;
          color: #e9ebf0;
          display: block;
          width: 100%;           /* span the whole row */
          text-align: center;    /* center text */
          transform: translateX(15px); /* move 20px to the right */
        }
        @media (min-width: 769px) {
            .mobile-menu-label {
                display: none; /* Hide label on desktop */
            }
        }

        .player-icon {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transform: translateX(25px); /* move 20px to the right */
        }
        
        .player-icon-right {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transform: translateX(-45px); /* move 20px to the left */
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        .last-games-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .last-games-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .last-games-header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: linear-gradient(135deg, #229954, #1e8449);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .refresh-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .last-updated {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .games-container {
            padding: 20px;
        }

        .games-title {
            color: #2c3e50;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
        }

        .games-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }

        .games-status {
            color: #687386;
            font-size: 0.85rem;
        }

        .player-name-with-record {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .head-to-head-record {
            color: #2878c8;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-card {
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #f3f8ff 100%);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #cfe0f2;
            border-inline-start: 4px solid #3498db;
            transition: all 0.3s ease;
        }

        .game-card:nth-child(even) {
            background: linear-gradient(135deg, #ffffff 0%, #f1fbfa 100%);
            border-color: #c9e8e3;
            border-inline-start-color: #2a9d8f;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: #3498db;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #d8e8f5;
        }

        .game-date {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-weight: 600;
        }

        .game-number {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .game-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .players-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
            margin-bottom: 8px;
        }

        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
        }

        .player-name.winner {
            color: #27ae60;
        }

        .vs-separator {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #7f8c8d;
        }

        .desktop-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .desktop-stat-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .desktop-stat-label {
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }

        .desktop-stat-values {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            flex: 1;
            align-items: center;
            text-align: center;
        }

        .desktop-vs-spacer {
            width: 20px;
        }

        .stats-labels {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            margin-bottom: 5px;
        }

        .labels-section {
            display: flex;
            justify-content: space-around;
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: 600;
        }

        .labels-spacer {
            width: 20px;
        }

        .stats-values {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
        }

        .player-values {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 0.85rem;
        }

        .desktop-only .player-values {
            justify-content: space-between;
        }

        .stat-value {
            font-weight: 700;
            color: #2c3e50;
            font-size: 0.85rem;
        }

        .points-change {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .points-gain {
            background: #d5f4e6;
            color: #27ae60;
        }

        .points-loss {
            background: #fadbd8;
            color: #e74c3c;
        }

        .sets-display {
            background: #e8f3ff;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            color: #23649a;
            font-size: 0.85rem;
        }

        .values-spacer {
            width: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.2rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fadbd8;
            color: #e74c3c;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin: 20px 0;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.1rem;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #bdc3c7;
        }

        .mobile-only {
            display: none;
        }

        .desktop-only {
            display: block;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .mobile-only {
                display: block;
            }

            .desktop-only {
                display: none;
            }
            body {
                padding: 5px;
            }

            .header {
                padding: 12px 10px;
                margin-bottom: 10px;
            }

            .header h1 {
                font-size: 1.5rem;
                margin-bottom: 5px;
            }

            .header p {
                font-size: 0.9rem;
            }

            .controls {
                padding: 10px;
                margin-bottom: 10px;
            }

            .refresh-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
                width: 100%;
            }

            .games-container {
                padding: 10px 8px;
            }

            .games-title {
                font-size: 1.3rem;
                margin-bottom: 10px;
            }

            .games-list {
                gap: 8px;
            }

            .game-card {
                padding: 10px;
            }

            .game-header {
                flex-direction: row;
                justify-content: space-between;
                gap: 5px;
                text-align: center;
                margin-bottom: 8px;
                padding-bottom: 5px;
            }

            .game-date {
                font-size: 0.75rem;
            }

            .game-number {
                font-size: 0.65rem;
                padding: 3px 8px;
            }

            .players-header {
                display: none;
            }

            .player-section {
                gap: 2px;
            }

            .vs-separator {
                font-size: 0.85rem;
                padding: 3px 0;
            }

            .stats-labels {
                display: none;
            }

            .stats-values {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .stats-values .desktop-only {
                display: none;
            }

            .stats-values .mobile-only {
                display: flex;
            }

            .mobile-stat-row {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 3px 0;
            }

            .mobile-stat-label {
                font-size: 0.7rem;
                color: #7f8c8d;
                font-weight: 600;
                min-width: 40px;
                text-align: right;
            }

            .mobile-stat-values {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                gap: 10px;
                flex: 1;
                align-items: center;
                text-align: center;
            }

            .mobile-stat-values .stat-value:first-child {
                text-align: center;
            }

            .mobile-stat-values .stat-value:last-child {
                text-align: center;
            }

            .mobile-stat-values .points-change:first-child {
                text-align: center;
            }

            .mobile-stat-values .points-change:last-child {
                text-align: center;
            }

            .mobile-vs-spacer {
                width: 20px;
            }

            .labels-spacer,
            .values-spacer {
                display: none;
            }

            .player-name {
                font-size: 0.95rem;
                margin-bottom: 3px;
            }

            .head-to-head-record {
                font-size: 0.75rem;
            }

            .labels-section {
                font-size: 0.7rem;
            }

            .player-values {
                font-size: 0.75rem;
            }

            .stat-value {
                font-size: 0.75rem;
            }

            .points-change {
                font-size: 0.7rem;
                padding: 1px 4px;
            }

            .sets-display {
                padding: 3px 6px;
                font-size: 0.75rem;
            }

            .game-content {
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 3px;
            }

            .header {
                padding: 8px 6px;
                margin-bottom: 8px;
            }

            .header h1 {
                font-size: 1.3rem;
                margin-bottom: 3px;
            }

            .header p {
                font-size: 0.8rem;
            }

            .controls {
                padding: 8px;
                margin-bottom: 8px;
            }

            .refresh-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .games-container {
                padding: 8px 5px;
            }

            .games-title {
                font-size: 1.2rem;
                margin-bottom: 8px;
            }

            .games-list {
                gap: 6px;
            }

            .game-card {
                padding: 8px;
            }

            .game-header {
                margin-bottom: 6px;
                padding-bottom: 4px;
            }

            .game-date {
                font-size: 0.7rem;
            }

            .game-number {
                font-size: 0.6rem;
                padding: 2px 6px;
            }

            .player-name {
                font-size: 0.9rem;
            }

            .head-to-head-record {
                font-size: 0.7rem;
            }

            .vs-separator {
                font-size: 0.8rem;
                padding: 2px 0;
            }

            .labels-section {
                font-size: 0.65rem;
            }

            .player-values {
                font-size: 0.7rem;
            }

            .stat-value {
                font-size: 0.7rem;
            }

            .points-change {
                font-size: 0.65rem;
                padding: 1px 3px;
            }

            .sets-display {
                padding: 2px 5px;
                font-size: 0.7rem;
            }

            .game-content {
                gap: 4px;
            }

            .players-header {
                gap: 8px;
                margin-bottom: 4px;
            }

            .player-section {
                gap: 1px;
            }

            .mobile-stat-row {
                gap: 8px;
                padding: 2px 0;
            }

            .mobile-stat-label {
                font-size: 0.65rem;
                min-width: 35px;
            }

            .stats-values {
                gap: 3px;
            }
        }
    </style>

        }
        
        .standalone-mobile-menu a:hover {
            color: #4f46e5;
        }
        
        /* Mobile styles */
        @media (max-width: 768px) {
            .standalone-nav-menu {
                display: none;
            }
            
            .standalone-mobile-toggle {
                display: block;
            }
            
            .standalone-nav-container {
                justify-content: space-between;
            }

    </style>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            collection, 
            doc,
            getDocs,
            getDocsFromCache,
            getDocsFromServer,
            getDocFromCache,
            getDocFromServer,
            setDoc,
            initializeFirestore,
            persistentLocalCache,
            query,
            orderBy,
            limit,
            where
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCJ3Y_5_O0yeQC3cqTRfyTPdU6GWFSq7rM",
            projectId: "ashdodtabletennis",
            authDomain: "ashdodtabletennis.firebaseapp.com",
            storageBucket: "ashdodtabletennis.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // Global variables
        let app = null;
        let db = null;
        const appStatusRef = () => doc(db, 'Statistics', 'App_Status');

        function logFirestoreRead(label, snapshot) {
            const documentCount = typeof snapshot.size === 'number'
                ? snapshot.size
                : (snapshot.exists() ? 1 : 0);
            console.log(`Firestore read - ${label}: ${documentCount} document(s)`);
            window.recordFirestoreRead?.(snapshot);
        }

        async function flushPreviousReadSession() {
            const session = JSON.parse(localStorage.getItem('firestoreReadSession') || 'null');
            if (!session?.playerId || !(Number(session.reads) > 0)) return;

            const readsRef = doc(db, 'Statistics', 'Reads_Count');
            const readsSnapshot = await getDocFromServer(readsRef);
            const existingPlayers = readsSnapshot.exists() ? (readsSnapshot.data().players || {}) : {};
            const existingPlayer = existingPlayers[session.playerId] || {};
            existingPlayers[session.playerId] = {
                name: session.playerName || existingPlayer.name || '',
                reads: (Number(existingPlayer.reads) || 0) + Number(session.reads)
            };
            await setDoc(readsRef, { players: existingPlayers }, { merge: true });
            localStorage.removeItem('firestoreReadSession');
        }

        function logCacheRead(label, snapshot) {
            const documentCount = typeof snapshot.size === 'number'
                ? snapshot.size
                : (snapshot.exists() ? 1 : 0);
            console.log(`Cache read - ${label}: ${documentCount} document(s)`);
        }

        // DOM elements
        const gamesContainer = document.getElementById('gamesContainer');
        const gamesStatus = document.getElementById('gamesStatus');
        const signInGate = document.getElementById('signInGate');
        const mainContent = document.getElementById('mainContent');
        const signInForm = document.getElementById('signInForm');
        let gamesQuery = null;

        function hasPlayerSession() {
            return Boolean(sessionStorage.getItem('playerEmail') && sessionStorage.getItem('playerPassword'));
        }

        function showSignIn() {
            signInGate.style.display = 'block';
            mainContent.style.display = 'none';
        }

        function showMainContent() {
            signInGate.style.display = 'none';
            mainContent.style.display = 'block';
        }

        signInForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('signInEmail').value.trim().toLowerCase();
            const password = document.getElementById('signInPassword').value.trim();
            const rememberLogin = document.getElementById('rememberLogin').checked;
            const signInButton = document.getElementById('signInButton');
            const signInError = document.getElementById('signInError');

            signInError.textContent = '';
            signInButton.disabled = true;
            signInButton.textContent = 'מתחבר...';

            try {
                if (!db) {
                    const firebaseReady = await initializeFirebase();
                    if (!firebaseReady) return;
                }

                const playersSnapshot = await getDocs(query(
                    collection(db, 'Players2'),
                    where('playerEmail', '==', email),
                    where('playerPassword', '==', password)
                ));
                logFirestoreRead('player login', playersSnapshot);

                if (playersSnapshot.empty) {
                    signInError.textContent = 'אימייל או סיסמה שגויים';
                    return;
                }

                const playerDocument = playersSnapshot.docs[0];
                await flushPreviousReadSession();
                sessionStorage.setItem('playerEmail', email);
                sessionStorage.setItem('playerPassword', password);
                sessionStorage.setItem('playerSession', JSON.stringify({
                    id: playerDocument.id,
                    data: playerDocument.data()
                }));
                window.startFirestoreReadSession?.({
                    id: playerDocument.id,
                    name: playerDocument.data().playerName
                });

                if (rememberLogin) {
                    localStorage.setItem('playerEmail', email);
                    localStorage.setItem('playerPassword', password);
                } else {
                    localStorage.removeItem('playerEmail');
                    localStorage.removeItem('playerPassword');
                }

                const returnTo = localStorage.getItem('authReturnTo');
                if (returnTo) {
                    localStorage.removeItem('authReturnTo');
                    window.location.replace(returnTo);
                } else {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Login error:', error);
                signInError.textContent = 'שגיאה בכניסה למערכת';
            } finally {
                signInButton.disabled = false;
                signInButton.textContent = 'כניסה';
            }
        });

        const rememberedEmail = localStorage.getItem('playerEmail');
        const rememberedPassword = localStorage.getItem('playerPassword');
        if (rememberedEmail) document.getElementById('signInEmail').value = rememberedEmail;
        if (rememberedPassword) document.getElementById('signInPassword').value = rememberedPassword;
        document.getElementById('rememberLogin').checked = Boolean(rememberedEmail && rememberedPassword);

        // Initialize Firebase
        function initializeFirebase() {
            try {
                console.log('🔥 Initializing Firebase...');
                
                app = initializeApp(firebaseConfig);
                db = initializeFirestore(app, {
                    localCache: persistentLocalCache()
                });
                
                console.log('✅ Firebase connected successfully');
                return true;
                
            } catch (error) {
                console.error('❌ Firebase connection error:', error);
                showError(`שגיאה בהתחברות ל-Firebase: ${error.message}`);
                return false;
            }
        }

        // Load last 10 games
        async function loadLastGames(forceRefresh = false) {
            try {
                gamesQuery = gamesQuery || query(collection(db, 'games'), orderBy('date', 'desc'), limit(10));
                let snapshot = null;
                let dataSource = 'cache';

                const displaySnapshot = (gamesSnapshot, source) => {
                    const games = [];
                    gamesSnapshot.forEach((gameDoc) => {
                        games.push({
                            id: gameDoc.id,
                            ...gameDoc.data()
                        });
                    });

                    console.log(`✅ Loaded ${games.length} games from ${source}`);
                    displayGames(games);
                };

                try {
                    snapshot = await getDocsFromCache(gamesQuery);
                    logCacheRead('last games', snapshot);
                    if (!snapshot.empty) {
                        displaySnapshot(snapshot, 'cache');
                        gamesStatus.textContent = '📦 משחקים מהמטמון';
                    }
                } catch (cacheError) {
                    console.log('No cached games available');
                }

                gamesStatus.textContent = snapshot && !snapshot.empty
                    ? '🔎 בודק אם יש משחקים חדשים...'
                    : '🔎 טוען משחקים...';

                let cachedStatusSnapshot = null;
                let serverStatusSnapshot;
                try {
                    cachedStatusSnapshot = await getDocFromCache(appStatusRef());
                    logCacheRead('game update metadata', cachedStatusSnapshot);
                } catch (cacheError) {
                    console.log('No cached game update metadata available');
                }

                serverStatusSnapshot = await getDocFromServer(appStatusRef());
                logFirestoreRead('game update metadata from server', serverStatusSnapshot);

                const cachedUpdatedGames = cachedStatusSnapshot?.exists()
                    ? cachedStatusSnapshot.data().lastUpdatedGames
                    : null;
                const serverUpdatedGames = serverStatusSnapshot.exists()
                    ? serverStatusSnapshot.data().lastUpdatedGames
                    : null;
                const timestampsMatch = cachedUpdatedGames && serverUpdatedGames
                    && cachedUpdatedGames.toMillis() === serverUpdatedGames.toMillis();

                console.log('Game update timestamp comparison:', {
                    cachedLastUpdatedGames: cachedUpdatedGames?.toDate?.()?.toISOString() || null,
                    serverLastUpdatedGames: serverUpdatedGames?.toDate?.()?.toISOString() || null,
                    timestampsMatch: Boolean(timestampsMatch)
                });

                if (!forceRefresh && timestampsMatch && snapshot && !snapshot.empty) {
                    gamesStatus.textContent = '✅ המטמון מעודכן';
                } else {
                    snapshot = await getDocsFromServer(gamesQuery);
                    logFirestoreRead('last games from server', snapshot);
                    dataSource = 'server';
                    displaySnapshot(snapshot, dataSource);
                    gamesStatus.textContent = timestampsMatch
                        ? '✅ המשחקים המעודכנים נטענו'
                        : '🆕 משחקים חדשים נטענו';
                }
                
            } catch (error) {
                console.error('❌ Error loading games:', error);
                showError(`שגיאה בטעינת המשחקים: ${error.message}`);
            }
        }

        // Display games
        function displayGames(games) {
            if (games.length === 0) {
                gamesContainer.innerHTML = '<div class="no-data">לא נמצאו משחקים במערכת</div>';
                return;
            }

            const gamesHtml = games.map((game, index) => {
                return generateGameCard(game, index + 1);
            }).join('');

            gamesContainer.innerHTML = `<div class="games-list">${gamesHtml}</div>`;
        }

        // Generate game card HTML
        function generateGameCard(game, fallbackGameNumber) {
            // Extract game data with fallbacks
            const date = formatDate(game.date);
            const gameNumber = game.gameNumber ?? fallbackGameNumber;
            const player1Name = game.player1Name || 'שחקן 1';
            const player2Name = game.player2Name || 'שחקן 2';
            const player1Points = game.player1Points || 0;
            const player2Points = game.player2Points || 0;
            const player1Amount = game.player1Amount || 0;
            const player2Amount = game.player2Amount || 0;
            const player1Sets = game.player1Sets || 0;
            const player2Sets = game.player2Sets || 0;
            const player1HeadToHead = game.player1HeadToHead || {};
            const player2HeadToHead = game.player2HeadToHead || {};
            const player1HeadToHeadPercentage = player1HeadToHead.games
                ? Math.round((player1HeadToHead.wins / player1HeadToHead.games) * 100)
                : 0;
            const player2HeadToHeadPercentage = player2HeadToHead.games
                ? Math.round((player2HeadToHead.wins / player2HeadToHead.games) * 100)
                : 0;
            const player1HeadToHeadRecord = `${player1HeadToHeadPercentage}% (${player1HeadToHead.wins ?? 0})`;
            const player2HeadToHeadRecord = `${player2HeadToHeadPercentage}% (${player2HeadToHead.wins ?? 0})`;

            // Determine winner (player with positive amount or higher sets)
            const player1IsWinner = player1Amount > 0 || (player1Amount === player2Amount && player1Sets > player2Sets);
            const player2IsWinner = player2Amount > 0 || (player2Amount === player1Amount && player2Sets > player1Sets);

            return `
                <div class="game-card">
                    <div class="game-header">
                        <div class="game-date">${date}</div>
                        <div class="game-number">משחק ${gameNumber}</div>
                    </div>
                    
                    <div class="game-content">
                        <!-- Players Names with VS and Sets -->
                        <div class="desktop-only">
                            <div class="desktop-stat-row">
                                <div class="desktop-stat-label">שם</div>
                                <div class="desktop-stat-values">
                                    <span class="player-name-with-record">
                                        <span class="player-name ${player1IsWinner ? 'winner' : ''}">${player1Name}</span>
                                        <span class="head-to-head-record">${player1HeadToHeadRecord}</span>
                                    </span>
                                    <div class="desktop-vs-spacer"></div>
                                    <span class="player-name-with-record">
                                        <span class="player-name ${player2IsWinner ? 'winner' : ''}">${player2Name}</span>
                                        <span class="head-to-head-record">${player2HeadToHeadRecord}</span>
                                    </span>
                                </div>
                            </div>
                            <div class="desktop-stat-row">
                                <div class="desktop-stat-label">סטים</div>
                                <div class="desktop-stat-values">
                                    <span class="sets-display">${player1Sets}</span>
                                    <div class="desktop-vs-spacer"></div>
                                    <span class="sets-display">${player2Sets}</span>
                                </div>
                            </div>
                            <div class="desktop-stat-row">
                                <div class="desktop-stat-label">ניקוד</div>
                                <div class="desktop-stat-values">
                                    <span class="stat-value">${player1Points}</span>
                                    <div class="desktop-vs-spacer"></div>
                                    <span class="stat-value">${player2Points}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Mobile Labels for Names and Sets -->
                        <div class="mobile-stat-row mobile-only">
                            <div class="mobile-stat-label">שם</div>
                            <div class="mobile-stat-values">
                                <span class="player-name-with-record">
                                    <span class="player-name ${player1IsWinner ? 'winner' : ''}">${player1Name}</span>
                                    <span class="head-to-head-record">${player1HeadToHeadRecord}</span>
                                </span>
                                <div class="mobile-vs-spacer"></div>
                                <span class="player-name-with-record">
                                    <span class="player-name ${player2IsWinner ? 'winner' : ''}">${player2Name}</span>
                                    <span class="head-to-head-record">${player2HeadToHeadRecord}</span>
                                </span>
                            </div>
                        </div>
                        <div class="mobile-stat-row mobile-only">
                            <div class="mobile-stat-label">סטים</div>
                            <div class="mobile-stat-values">
                                <span class="sets-display">${player1Sets}</span>
                                <div class="mobile-vs-spacer"></div>
                                <span class="sets-display">${player2Sets}</span>
                            </div>
                        </div>

                        <!-- Desktop Stats Layout -->
                        <div class="desktop-stats desktop-only">
                            <div class="desktop-stat-row">
                                <div class="desktop-stat-label">נקודות</div>
                                <div class="desktop-stat-values">
                                    <span class="points-change ${player1Amount >= 0 ? 'points-gain' : 'points-loss'}">
                                        ${player1Amount >= 0 ? '+' : ''}${player1Amount}
                                    </span>
                                    <div class="desktop-vs-spacer"></div>
                                    <span class="points-change ${player2Amount >= 0 ? 'points-gain' : 'points-loss'}">
                                        ${player2Amount >= 0 ? '+' : ''}${player2Amount}
                                    </span>
                                </div>
                            </div>
                        </div>
                            
                            <!-- Mobile Stats Layout -->
                            <div class="mobile-stat-row mobile-only">
                                <div class="mobile-stat-label">ניקוד</div>
                                <div class="mobile-stat-values">
                                    <span class="stat-value">${player1Points}</span>
                                    <div class="mobile-vs-spacer"></div>
                                    <span class="stat-value">${player2Points}</span>
                                </div>
                            </div>
                            <div class="mobile-stat-row mobile-only">
                                <div class="mobile-stat-label">נקודות</div>
                                <div class="mobile-stat-values">
                                    <span class="points-change ${player1Amount >= 0 ? 'points-gain' : 'points-loss'}">
                                        ${player1Amount >= 0 ? '+' : ''}${player1Amount}
                                    </span>
                                    <div class="mobile-vs-spacer"></div>
                                    <span class="points-change ${player2Amount >= 0 ? 'points-gain' : 'points-loss'}">
                                        ${player2Amount >= 0 ? '+' : ''}${player2Amount}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Format date for display
        function formatDate(dateValue) {
            if (!dateValue) return 'תאריך לא זמין';
            
            try {
                let date;
                
                // Handle Firestore Timestamp
                if (dateValue && typeof dateValue.toDate === 'function') {
                    date = dateValue.toDate();
                }
                // Handle string dates
                else if (typeof dateValue === 'string') {
                    date = new Date(dateValue);
                }
                // Handle Date objects
                else if (dateValue instanceof Date) {
                    date = dateValue;
                }
                // Handle timestamp numbers
                else if (typeof dateValue === 'number') {
                    date = new Date(dateValue);
                }
                else {
                    return 'תאריך לא תקין';
                }

                // Check if date is valid
                if (isNaN(date.getTime())) {
                    return 'תאריך לא תקין';
                }

                // Format date in Hebrew locale
                return date.toLocaleString('he-IL', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
            } catch (error) {
                console.error('Error formatting date:', error);
                return 'תאריך לא תקין';
            }
        }

        // Show error message
        function showError(message) {
            gamesContainer.innerHTML = `<div class="error">${message}</div>`;
        }



        // Initialize the application
        async function initApp() {
            
            if (!hasPlayerSession()) {
                showSignIn();
                return;
            }

            showMainContent();
            
            const firebaseReady = initializeFirebase();
            
            if (firebaseReady) {
                await loadLastGames();
            } else {
                console.error('❌ Firebase initialization failed');
                gamesContainer.innerHTML = '<div class="error">שגיאה בהתחברות למסד הנתונים</div>';
            }
        }

        // Start the application
        initApp();
    </script>
